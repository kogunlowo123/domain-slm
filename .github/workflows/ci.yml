name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.10"
  PYTHON_VERSION: "3.12"
  # The shipped example, shared by several jobs. Kept here so a change to it is
  # one edit rather than five.
  SPLITS: examples/splits
  MODEL: examples/model
  NULL_CORPUS: examples/holdout.jsonl.gz
  BASELINE: examples/baseline.json

jobs:
  quality:
    name: Lint, format, types, docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --group dev --group docs

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      - name: Build the documentation site
        # The builder fails on a broken internal link, so a renamed page fails
        # the pull request rather than shipping a 404.
        run: uv run --only-group docs python scripts/build_site.py --output _site

  test:
    name: Tests (${{ matrix.layer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every marker declared in pyproject.toml. A layer that exists and is
        # never selected is a layer nobody runs.
        layer: [unit, integration, security, e2e, meta]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --group dev

      - name: pytest -m ${{ matrix.layer }}
        # Bare, with no coverage flag: a matrix leg that inherited the coverage
        # gate would fail on every leg but the full one, for a reason that has
        # nothing to do with the layer it is reporting on.
        run: uv run pytest -m ${{ matrix.layer }} -v

  coverage:
    name: Coverage gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --group dev

      - name: Full suite with the coverage gate
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90

  gates:
    name: The tool gates its own example
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked

      - name: doctor
        run: uv run dslm doctor --corpus examples/corpus.jsonl.gz

      - name: The committed corpora still match their plans
        # Catches a corpus regenerated by a different build, or edited by hand.
        #
        # Not "regenerate and git diff": that compares bytes, and bytes carry
        # things no consumer reads. This compares the digest, which is over what
        # a model actually learns from.
        run: |
          uv run dslm check --plan main --corpus examples/corpus.jsonl.gz
          uv run dslm check --plan holdout --corpus "$NULL_CORPUS"

      - name: Evaluate, with the contamination and regression gates
        # The control. Without a green control the red results below could be
        # facts about the tool rather than about the data.
        run: |
          uv run dslm evaluate \
            --splits "$SPLITS" --model "$MODEL" \
            --null "$NULL_CORPUS" --drop-shared \
            --baseline "$BASELINE" \
            --json-out reports/evaluation.json \
            --junit-out reports/evaluation.xml \
            --markdown-out reports/evaluation.md

      - name: The gate fires on injected contamination, and measures its rate
        # Asserts four things: the shipped pipeline passes; the gate refuses
        # without a null corpus; contamination injected at 5%, 10% and 25% exits
        # 2 specifically; and the rate the gate *reports* is an estimate of the
        # rate injected. The last is the difference between a flag and a
        # measurement, and only a test with a known answer can check it.
        run: uv run python scripts/check-pipeline.py

      - name: Publish the summary
        if: always()
        run: cat reports/evaluation.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-reports
          path: reports/
          if-no-files-found: error

  examples:
    name: Examples
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked

      - name: Run every example
        # They are documentation that executes. One that stops working is a
        # README that lies.
        run: |
          uv run python examples/quickstart.py
          uv run python examples/contamination_demo.py
          uv run python examples/tokenizer_demo.py

  build:
    name: Distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build the wheel and sdist
        run: uv build

      - name: The wheel installs and its console script works
        # Building is not the same as being installable. This catches a missing
        # package directory or a broken entry point, which a source checkout
        # never notices.
        run: |
          uv venv /tmp/verify
          VIRTUAL_ENV=/tmp/verify uv pip install dist/*.whl
          /tmp/verify/bin/dslm --version
          /tmp/verify/bin/dslm doctor

      - uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: dist/
          if-no-files-found: error
